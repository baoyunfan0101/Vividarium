[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/vividarium-core",
]
resolver = "2"

[workspace.package]
version = "3.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/baoyunfan0101/Vividarium"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
