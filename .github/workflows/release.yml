name: Release desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Verify release ref and version
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = tag || { echo "::error::Releases must run from a tag"; exit 1; }
          node scripts/check-release-version.mjs "$GITHUB_REF_NAME"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Test desktop frontend
        working-directory: apps/desktop
        run: npm run test:desktop

      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        run: cargo test --workspace --locked

  release:
    needs: verify
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Validate updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is missing"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing"; exit 1; }

      - name: Build and publish Tauri package
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: Vividarium v__VERSION__
          releaseBody: |
            Private desktop build for macOS Apple Silicon and Windows x64.

            These packages are not notarized or signed by a paid developer certificate. Manual trust confirmation is required on first launch.

            See the repository CHANGELOG for release details and upgrade notes.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  finalize-release:
    needs: [verify, release]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify release assets and updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/validate-updater-json.mjs release-assets/latest.json "$VERSION"
          find release-assets -type f -name '*.dmg' -print -quit | grep -q . || { echo "::error::macOS DMG is missing"; exit 1; }
          find release-assets -type f -name '*-setup.exe' -print -quit | grep -q . || { echo "::error::Windows NSIS installer is missing"; exit 1; }
          node - <<'NODE'
          const { existsSync, readFileSync } = require("node:fs");
          const { basename } = require("node:path");
          const manifest = JSON.parse(readFileSync("release-assets/latest.json", "utf8"));
          for (const entry of Object.values(manifest.platforms)) {
            const asset = basename(new URL(entry.url).pathname);
            if (!existsSync(`release-assets/${asset}`) || !existsSync(`release-assets/${asset}.sig`)) {
              throw new Error(`missing updater artifact or signature for ${asset}`);
            }
          }
          NODE

      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
